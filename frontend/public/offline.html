<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06080c">
<title>Offline — OpenTerminal</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #06080c;
  color: #b0b8c8;
  font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  padding: 24px;
}
.offline-card {
  max-width: 400px;
  text-align: center;
  border: 1px solid #2a2f3a;
  border-radius: 4px;
  padding: 40px 32px;
  background: #0d1117;
}
.offline-icon {
  font-size: 48px;
  margin-bottom: 16px;
}
h1 {
  font-size: 18px;
  font-weight: 600;
  color: #e6edf3;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
p {
  font-size: 14px;
  line-height: 1.6;
  color: #8b949e;
  margin-bottom: 24px;
}
.retry-btn {
  display: inline-block;
  padding: 10px 24px;
  font-family: inherit;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #e6edf3;
  background: #1f6feb;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  text-decoration: none;
}
.retry-btn:hover { background: #388bfd; }
.retry-btn:focus-visible { outline: 2px solid #58a6ff; outline-offset: 2px; }
</style>
</head>
<body>
<div class="offline-card" role="alert">
  <div class="offline-icon" aria-hidden="true">&#9888;</div>
  <h1>No Connection</h1>
  <p>Market data requires a network connection.<br>Please check your connection and try again.</p>
  <button class="retry-btn" onclick="location.reload()" type="button">Retry</button>
</div>
</body>
</html>
