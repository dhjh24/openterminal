# OpenTerminalUI — isolated Compose stack
# Project identity, ports, and credentials come from `.env` (see `.env.example`).
# Production tip: publish only the app. Use `docker-compose.override.yml` (dev)
# or `--profile host-ports` when you need Postgres/Redis on the host.

name: ${COMPOSE_PROJECT_NAME:-openterminalui}

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-openterminalui}:latest
    ports:
      # Single container serves the SPA + API (no separate web service).
      # WEB_PORT / APP_PORT in .env should match API_PORT for docs and CORS.
      - "${API_PORT:-8105}:8000"
    # Compose still reads repo-root `.env` for ${VAR} interpolation when present.
    # Do not use `env_file: .env` here — CI has no `.env` (gitignored) and would fail validation.
    environment:
      OPENTERMINALUI_ENV: "${OPENTERMINALUI_ENV:-development}"
      MARKET_PROFILE: "${MARKET_PROFILE:-US}"
      US_RISK_FREE_RATE: "${US_RISK_FREE_RATE:-4.5}"
      FMP_API_KEY: "${FMP_API_KEY:-}"
      FINNHUB_API_KEY: "${FINNHUB_API_KEY:-}"
      FINNHUB_WS_ENABLED: "${FINNHUB_WS_ENABLED:-true}"
      FRED_API_KEY: "${FRED_API_KEY:-}"
      ALPACA_API_KEY: "${ALPACA_API_KEY:-}"
      ALPACA_SECRET_KEY: "${ALPACA_SECRET_KEY:-}"
      ALPACA_FEED: "${ALPACA_FEED:-iex}"
      ALPACA_ADJUSTMENT: "${ALPACA_ADJUSTMENT:-raw}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-}"
      CACHE_SIGNING_KEY: "${CACHE_SIGNING_KEY:-}"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      # Prefer explicit DATABASE_URL. For the postgres profile, set it to the
      # Docker-network form: postgresql://USER:PASS@postgres:5432/DB
      DATABASE_URL: "${DATABASE_URL:-sqlite+aiosqlite:////data/openterminal.db}"
      # Force the compose Redis service hostname. Host `.env` often sets localhost for non-Docker runs.
      REDIS_URL: "redis://redis:6379/0"
      OPENTERMINALUI_PREFETCH_ENABLED: "${OPENTERMINALUI_PREFETCH_ENABLED:-${OPENSCREENS_PREFETCH_ENABLED:-0}}"
      OPENTERMINALUI_SQLITE_URL: "${OPENTERMINALUI_SQLITE_URL:-${OPENSCREENS_SQLITE_URL:-sqlite:////data/openterminalui.db}}"
      OPENTERMINALUI_CORS_ORIGINS: "${OPENTERMINALUI_CORS_ORIGINS:-${CORS_ORIGINS:-http://localhost:8105,http://127.0.0.1:8105,http://localhost:5173,http://127.0.0.1:5173}}"
      LM_STUDIO_BASE_URL: "${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}"
      LM_STUDIO_MODEL: "${LM_STUDIO_MODEL:-google/gemma-4-26b-a4b}"
      LM_STUDIO_ENABLED: "${LM_STUDIO_ENABLED:-true}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      AGENT_PROVIDER: "${AGENT_PROVIDER:-openrouter}"
      AGENT_MODEL: "${AGENT_MODEL:-openai/gpt-oss-20b:free}"
      AGENT_DISABLE_MODEL_FALLBACKS: "${AGENT_DISABLE_MODEL_FALLBACKS:-false}"
      AGENT_MODELS_TOOL_USE: "${AGENT_MODELS_TOOL_USE:-meta-llama/llama-3.3-70b-instruct:free,qwen/qwen3-coder:free,openai/gpt-oss-20b:free}"
      AGENT_MODELS_REASONING: "${AGENT_MODELS_REASONING:-deepseek/deepseek-r1:free,qwen/qwq-32b:free,openai/gpt-oss-120b:free,openai/gpt-oss-20b:free}"
      AGENT_MODELS_GENERAL: "${AGENT_MODELS_GENERAL:-openai/gpt-oss-20b:free,google/gemini-2.0-flash-exp:free}"
      AGENT_FALLBACK_MODELS: "${AGENT_FALLBACK_MODELS:-openai/gpt-oss-20b:free,qwen/qwen3-coder:free,meta-llama/llama-3.3-70b-instruct:free}"
      AGENT_DEBATE_ENABLED: "${AGENT_DEBATE_ENABLED:-true}"
      AGENT_STRATEGY_LOOP_ENABLED: "${AGENT_STRATEGY_LOOP_ENABLED:-true}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/data
    networks:
      - app_network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
    develop:
      watch:
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./backend
        - action: rebuild
          path: ./frontend
        - action: rebuild
          path: ./config
        - action: rebuild
          path: ./data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7-alpine
    # Internal only by default — host publish lives in docker-compose.override.yml
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-openterminalui}"
      POSTGRES_USER: "${POSTGRES_USER:-openterminalui_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-this-password}"
    # Internal only by default — host publish lives in docker-compose.override.yml
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openterminalui_user} -d ${POSTGRES_DB:-openterminalui}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  # Explicit project-prefixed names. App/Postgres keep the historical Compose
  # names (`{project}_openterminalui_*`) so existing installs retain data.
  app_data:
    name: ${COMPOSE_PROJECT_NAME:-openterminalui}_openterminalui_data
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-openterminalui}_openterminalui_postgres_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-openterminalui}_redis_data
