name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    name: Backend lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy types-PyYAML

      - name: Ruff lint
        run: ruff check backend --select E9,F63,F7,F82 --ignore E501 || true
        # Soft gate: syntax/undefined-name class issues; expand over time.

      - name: Python compileall
        run: PYTHONPATH=. python -m compileall backend

      - name: Run pytest with coverage
        run: PYTHONPATH=. pytest backend/tests -q --cov=backend --cov-fail-under=45 --cov-report=xml --junitxml=pytest-report.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: |
            pytest-report.xml
            coverage.xml

  frontend:
    name: Frontend lint, types, build, Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Typecheck / lint
        run: |
          if npm run --silent typecheck; then
            echo "typecheck ok"
          elif npx tsc --noEmit; then
            echo "tsc ok"
          else
            echo "::warning::No dedicated typecheck script; relying on production build"
          fi
        working-directory: frontend
        continue-on-error: true

      - name: Production build
        run: npm run build
        working-directory: frontend

      - name: Vitest
        run: npx vitest run
        working-directory: frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  playwright:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Playwright smoke
        run: npm run test:e2e -- --grep "us-smoke|login page|option chain|settings migration|unsupported India|websocket reconnect|dashboard"
        working-directory: frontend
        continue-on-error: true
        # Full e2e suite also runs below for required coverage.

      - name: Playwright full suite
        run: npm run test:e2e
        working-directory: frontend

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt || true

      - name: npm audit
        run: |
          cd frontend
          npm ci --ignore-scripts
          npm audit --omit=dev || true

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  docker:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          docker compose -f docker-compose.yml config
          # Host port mappings must stay: app 8005, Redis 6380, Postgres 5433
          docker compose -f docker-compose.yml config | grep -E '8005:8000|6380:6379|5433:5432'
